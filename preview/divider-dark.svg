<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="28" viewBox="0 0 840 28" fill="none" role="img" aria-label="divider">
<title>divider</title>
<style>
svg{color-scheme:dark}
text{font-family:JBMono, 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
.t{fill:#fafafa}.m{fill:#8b8b8f}.a{fill:#dc2626}.g{fill:#ef4444}.s{fill:#3f3f46}
.b{font-weight:700}
.fx{transform-box:fill-box;transform-origin:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes roll{to{transform:translateY(var(--y))}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
.in{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn .8s ease both}
.blink{animation:blink 1s step-end infinite}
@media (prefers-reduced-motion: reduce){
  *{animation-delay:0s!important;animation-duration:1ms!important;animation-iteration-count:1!important}
  .loop{animation:none!important}
}
.comet{animation:comet 5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes comet{0%{transform:translateX(-160px)}100%{transform:translateX(880px)}}
.tick{animation:pulse 2.4s ease-in-out infinite}</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#3f3f46" opacity="0.55"/></pattern>
<linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18181b" stop-opacity="0"/><stop offset="1" stop-color="#18181b"/></linearGradient><linearGradient id="cometG" x1="0" x2="1"><stop offset="0" stop-color="#dc2626" stop-opacity="0"/><stop offset=".85" stop-color="#ef4444"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="lineG" x1="0" x2="1"><stop offset="0" stop-color="#27272a" stop-opacity="0"/><stop offset=".5" stop-color="#3f3f46"/><stop offset="1" stop-color="#27272a" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="13.5" width="840" height="1" fill="url(#lineG)"/>
<g class="comet loop"><rect x="0" y="13" width="140" height="2" rx="1" fill="url(#cometG)" filter="url(#glow)"/></g>
<rect x="386" y="8" width="68" height="12" fill="#0d0d0f"/><rect class="tick loop" style="animation-delay:0s" x="401" y="11" width="6" height="6" rx="1.5" transform="rotate(45 404 14)" fill="#3f3f46"/><rect class="tick loop" style="animation-delay:0.3s" x="417" y="11" width="6" height="6" rx="1.5" transform="rotate(45 420 14)" fill="#dc2626"/><rect class="tick loop" style="animation-delay:0.6s" x="433" y="11" width="6" height="6" rx="1.5" transform="rotate(45 436 14)" fill="#3f3f46"/>
</svg>
