name: generate snake animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"
  # allow manual runs at any time
  workflow_dispatch:
  # run on every push to master
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # generates a snake game from a github user's contribution graph
      - name: Generate github-contribution-grid-snake-dark.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#dc2626&color_dots=#1e1e20,#55555a,#8b8b8f,#c1c1c4,#fafafa

      - name: Shift snake 18px left
        run: |
          perl -i -pe 's/viewBox="(-?\d+)/"viewBox=\"" . ($1 + 18)/e' dist/github-contribution-grid-snake-dark.svg

      # push the contents of dist/ to the output branch using plain git
      - name: Push to output branch
        run: |
          cd dist
          git init
          git checkout -b output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update snake animation"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output:output
