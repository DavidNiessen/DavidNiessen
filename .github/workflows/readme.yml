# Rebuilds the animated profile README every day at 02:17 UTC.
# Generated by Readme Studio: https://readme.niessen.dev/
name: readme

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - readme.config.json
      - .github/workflows/readme.yml

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: DavidNiessen/readme-studio@v1
        with:
          config: readme.config.json
          asset-branch: output
          # Optional: a fine-grained token with read access to your profile
          # adds private contribution counts and exact totals.
          profile-token: ${{ secrets.PROFILE_TOKEN }}
