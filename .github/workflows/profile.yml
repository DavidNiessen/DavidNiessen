name: profile

on:
  # every night at 02:17 UTC (03:17 Berlin in winter, 04:17 in summer)
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "generator/**"
      - ".github/workflows/profile.yml"
  pull_request:
    paths:
      - "generator/**"
      - ".github/workflows/profile.yml"

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: generator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      # Pull requests render with offline fixture data; everything else uses live data.
      # PROFILE_TOKEN (optional PAT with read:user) adds private contribution counts.
      - name: Render assets
        run: npm run build -- ${{ github.event_name == 'pull_request' && '--mock' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: profile-assets
          path: generator/dist
          retention-days: 7

      - name: Publish assets to the output branch
        if: github.event_name != 'pull_request'
        working-directory: generator/dist
        run: |
          git init -q
          git checkout -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: rebuild profile assets $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output:output

      - name: Update README when the layout changed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: .
        run: |
          cp generator/dist/README.md README.md
          if git diff --quiet -- README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): update generated layout [skip ci]"
          git push
